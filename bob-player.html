<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOB Player - Tarification</title>
    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styles */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1e1e1e; /* Gray background */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Full-width Header */
        header {
            width: 100%;
            background: linear-gradient(135deg, #1f1f1f, #04608e);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
        }

        .logo a {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            padding: 6px 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #ffffff;
            color: #00b8e6;
        }

        /* Centering container for the Pricing Box */
        .pricing-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            min-height: 80vh;
            padding-top: 50px; /* Added top padding for extra space */
        }

        /* Logo Image */
        .logo-image {
            width: 200px;
            height: auto;
            margin-bottom: 20px; /* Added margin to create space below the logo */
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* Slight shadow for depth */
        }

        /* Section Title */
        .section-title {
            color: #00b8e6; /* Light blue color for the text */
            font-size: 24px; /* Slightly larger font size */
            font-weight: 600;
            text-align: center;
            margin-bottom: 40px; /* Space below the title */
        }

        /* Pricing Box */
        .pricing-box {
            background: linear-gradient(135deg, #1f1f1f, #292929);
            color: #ffffff;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
            border-top: 4px solid #00b8e6;
            max-width: 300px;
            text-align: center;
            position: relative;
        }

        .badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #d32f2f;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .pricing-box h3 {
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .price {
            font-size: 36px;
            color: #00b8e6;
            margin: 15px 0;
            font-weight: 700;
        }

        .pricing-box ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .pricing-box ul li {
            padding: 8px 0;
            font-size: 16px;
            color: #dddddd;
        }

        .pricing-box ul li::before {
            content: '✔';
            margin-right: 8px;
            color: #00d8ff;
        }

        /* Button */
        .btn {
            background-color: #00b8e6;
            color: #000;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
            display: inline-block;
            margin-top: 15px;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .btn:hover {
            background-color: #0088cc;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Media Queries */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                text-align: center;
            }

            .nav-links {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    
    <!-- Full-width Header Section -->
    <header>
        <div class="header-container">
            <h1 class="logo"><a href="index.html">BOB Player</a></h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="iptv.html">Plans IPTV</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Centered Pricing Section -->
    <div class="pricing-container">
        <!-- Logo Image Above the Pricing Box -->
        <img src="bob.webp" alt="bob Player Logo" class="logo-image">

        <!-- Section Title -->
        <h2 class="section-title">Choisissez la durée d'abonnement</h2>
        
        <div class="pricing-box">
            <div class="badge premium">PREMIUM +</div>
            <div class="icon-container">💻</div>
            <h3>à vie</h3>
            <div class="price">1500 dzd</div>
            <ul>
                <li>Qualité Full HD, et 4K</li>
                <li>Films et Séries</li>
                <li>Replay</li>
                <li>Mise à jour Gratuite</li>
                <li>Compatible Avec Tous Les Appareils!</li>
                <li>EPS Actualisé</li>
                <li>Service Après Vente</li>
            </ul>
            <a href="https://wa.me/+213560599031" class="btn">Commander via WhatsApp</a>
        </div>
    </div>

</body>
</html>
